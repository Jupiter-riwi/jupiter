<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pago cancelado — Apex Vision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles-seller.css" />
  <style>
    body { margin: 0; background: #0a0a0a; color: #e6e6e6; font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px 48px; max-width: 460px; text-align: center; }
    .icon { font-size: 40px; color: rgba(230,230,230,0.4); margin-bottom: 12px; }
    h1 { font-weight: 200; letter-spacing: -0.02em; font-size: 24px; margin: 0 0 8px; }
    p { color: rgba(230,230,230,0.6); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    .mono { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; letter-spacing: 0.14em; color: rgba(230,230,230,0.4); }
    a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: rgba(255,255,255,0.06); color: #e6e6e6; border: 1px solid rgba(255,255,255,0.12); text-decoration: none; font-size: 13px; margin: 0 6px; }
    a.btn.primary { background: rgba(120,255,180,0.18); color: #9ef5be; border-color: rgba(120,255,180,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">○</div>
    <div class="mono">PAGO CANCELADO</div>
    <h1 style="margin-top: 14px;">No se cobró nada</h1>
    <p>
      Cancelaste el flujo de pago antes de completarlo. Tu saldo y tu plan
      siguen exactamente igual. Podés volver e intentar de nuevo cuando quieras.
    </p>
    <a class="btn primary" href="/seller">Volver a Facturación</a>
    <a class="btn" href="/seller">Ir al inicio</a>
  </div>
</body>
</html>
