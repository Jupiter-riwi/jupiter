<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pago confirmado — Apex Vision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles-seller.css" />
  <style>
    body { margin: 0; background: #0a0a0a; color: #e6e6e6; font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px 48px; max-width: 460px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-weight: 200; letter-spacing: -0.02em; font-size: 24px; margin: 0 0 8px; }
    p { color: rgba(230,230,230,0.6); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    .mono { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; letter-spacing: 0.14em; color: rgba(230,230,230,0.4); }
    a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: rgba(120,255,180,0.18); color: #9ef5be; border: 1px solid rgba(120,255,180,0.4); text-decoration: none; font-size: 13px; }
    a.btn:hover { background: rgba(120,255,180,0.28); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <div class="mono">PAGO CONFIRMADO</div>
    <h1 style="margin-top: 14px;">¡Listo!</h1>
    <p>
      Tu pago fue procesado por Stripe. En unos segundos verás los Apex Tokens
      acreditados en tu saldo. Si no aparecen, recarga la página de facturación.
    </p>
    <a class="btn" href="/seller">Volver a Apex Vision</a>
    <div class="mono" style="margin-top: 18px;">
      <span id="session-id"></span>
    </div>
  </div>
  <script>
    // Show the Stripe session id if it came back in the URL (debug aid only).
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session_id');
    if (sid) {
      document.getElementById('session-id').textContent = 'session ' + sid.slice(0, 22) + '…';
    }
  </script>
</body>
</html>
