<script>
/* PWA install + service worker — mobile only (Android/iOS). Desktop browsers
   never get the manifest link, the SW, or an install prompt. */
(function () {
  var isMobile = window.matchMedia('(pointer: coarse)').matches
    || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || window.matchMedia('(max-width: 820px)').matches;
  if (!isMobile) return;

  document.documentElement.classList.add('is-mobile-pwa');

  var manifest = document.createElement('link');
  manifest.rel = 'manifest';
  manifest.href = 'manifest.webmanifest';
  document.head.appendChild(manifest);

  var meta = [
    ['theme-color', '#050507'],
    ['apple-mobile-web-app-capable', 'yes'],
    ['apple-mobile-web-app-status-bar-style', 'black-translucent'],
    ['apple-mobile-web-app-title', 'Apex Vision'],
    ['mobile-web-app-capable', 'yes'],
  ];
  meta.forEach(function (pair) {
    var m = document.createElement('meta');
    m.name = pair[0]; m.content = pair[1];
    document.head.appendChild(m);
  });

  var appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = 'icons/apple-touch-icon.png';
  document.head.appendChild(appleIcon);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
