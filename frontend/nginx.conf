server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Public landing page at the root. Unknown paths still fall through to the
    # app (see the prefix "/" block below).
    location = / {
        try_files "/landing.html" =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /landing.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        return 302 $scheme://$http_host/seller;
    }

    location /seller {
        try_files "/Apex Vision Vendedor.html" =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /admin {
        try_files "/Apex Vision Console.html" =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Billing return pages (Stripe Checkout redirects here). Served directly so
    # they are not swallowed by the "/" -> /seller redirect below.
    location = /billing-success.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /billing-cancel.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|jsx|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }
}
