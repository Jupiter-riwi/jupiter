<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<base href="/"/>
<title>Apex Vision · Evaluá tu pitch comercial con IA</title>
<meta name="description" content="Apex Vision evalúa tus pitches de ventas con IA: lenguaje corporal, voz y discurso. Score objetivo, coaching accionable y práctica en vivo."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="styles-seller.css"/>
<style>
  /* Mobile optimization for the public landing. The app's PublicLanding uses
     fixed multi-column grids and large type (inline styles); these !important
     rules are scoped to #root so they only reshape the landing on small screens
     and never touch the rest of the app. */

  /* Hero headline scales smoothly (caps at the original 54px on desktop). */
  #root h1 { font-size: clamp(30px, 8.5vw, 54px) !important; }

  @media (max-width: 768px) {
    #root .s-stage { padding: 16px 14px 48px !important; }
    #root .s-topbar { padding: 0 16px !important; }

    /* Features: 3 cols -> 1 col */
    #root #features { grid-template-columns: 1fr !important; }
    /* How it works: 4 cols -> 2 cols */
    #root #how-it-works [style*="repeat(4"] { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
    /* For teams: 2 cols -> 1 col */
    #root #para-empresas { grid-template-columns: 1fr !important; padding: 28px 22px !important; gap: 22px !important; }
    /* Pricing: 3 cols -> 1 col */
    #root #precios [style*="repeat(3"] { grid-template-columns: 1fr !important; }

    /* Hero CTA: keep it from overflowing narrow screens */
    #root .btn-primary { padding: 14px 22px !important; font-size: 12px !important; }
  }

  @media (max-width: 560px) {
    /* Hide the section links in the top bar; keep the logo */
    #root .s-topbar > div:nth-child(2) { display: none !important; }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="root"></div>

<!-- Same React/Babel stack as the main app, so the landing IS the app's own
     PublicLanding component (identical look, zero drift). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="api-client.js"></script>
<script src="i18n.js"></script>
<script src="particles.js"></script>
<script type="text/babel" src="seller-home.jsx"></script>

<script type="text/babel">
  // Public landing host: renders the app's real PublicTopBar + PublicLanding.
  // All CTAs lead to the deployed app so the page works from both the app
  // domain (served at /) and the standalone Vercel deployment.
  const APP_URL = 'https://apexvision.zerogate.company/seller';

  function goToApp() { window.location.href = APP_URL; }

  function scrollToId(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function homeTop() {
    const stage = document.querySelector('.s-stage');
    if (stage) stage.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function Landing() {
    return React.createElement(
      'div', { className: 's-shell' },
      React.createElement(window.PublicTopBar, { onHome: homeTop, onSection: scrollToId }),
      React.createElement(window.PublicLanding, { onStart: goToApp })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Landing));
</script>
</body>
</html>
