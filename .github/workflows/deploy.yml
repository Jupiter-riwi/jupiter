name: Deploy to VPS

# Auto-deploy: every push to `developer` SSHes into the Hetzner VPS and rebuilds
# the stack (frontend baked into its nginx image, so a rebuild is required for
# changes to go live). Also runnable on demand from the Actions tab.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         VPS IP or hostname (e.g. apexvision.zerogate.company)
#   SSH_USER         SSH user with docker + repo access (e.g. deploy or root)
#   SSH_PRIVATE_KEY  the PRIVATE key whose public half is in the server's
#                    ~/.ssh/authorized_keys (paste the full key incl. header/footer)
#   DEPLOY_PATH      absolute path to the jupiter repo on the VPS (e.g. /opt/jupiter)
# Optional:
#   SSH_PORT         SSH port (defaults to 22)

on:
  push:
    branches: [developer]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight deploy finish before the next.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▶ Fetching latest developer…"
            git fetch --prune origin developer
            git checkout developer
            # Match the remote exactly. .env.prod and other gitignored files are
            # untracked, so reset --hard leaves them intact.
            git reset --hard origin/developer

            echo "▶ Rebuilding + restarting the stack…"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                           --env-file .env.prod up -d --build

            echo "▶ Pruning old images…"
            docker image prune -f || true

            echo "✓ Deploy complete."
